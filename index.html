<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d62828">
<title>Order online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#d62828;--ink:#2b0f0f;--accent:#f0a202;--bg:#fbf6ef;--card:#fff;--txt:#2b1d17;--line:#eadfce;--mut:#7d6e62;--ok:#1d7a3e;--r:20px;--head:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;--font:"Plus Jakarta Sans",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#15110f;--card:#211b18;--txt:#f6ece3;--line:#342c27;--mut:#a89b8f}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:15px/1.55 var(--font);background:var(--bg);color:var(--txt);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.02;letter-spacing:-.025em}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
.wrap{width:min(1180px,100% - 28px);margin-inline:auto}.pad{padding:26px 0 90px}.mut{color:var(--mut)}.ok{color:var(--ok);font-weight:700}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(14px);color:#fff;padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;gap:10px;min-height:62px}
#brand{display:flex;align-items:center;gap:10px;margin-right:auto;color:#fff;text-decoration:none;font:800 21px var(--head);min-width:0}
#brand img{height:36px;max-width:150px;object-fit:contain;border-radius:8px}
nav{display:flex;gap:4px;align-items:center}
nav a,nav button{color:#fff;text-decoration:none;padding:9px 13px;border-radius:99px;background:none;font-weight:600;font-size:13.5px}
nav a:hover,nav button:hover{background:rgba(255,255,255,.14)}
#cartBtn{background:var(--accent);color:var(--ink);font-weight:700}#cartBtn b{margin-left:6px;background:var(--ink);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;background:var(--brand);color:#fff;text-decoration:none;line-height:1.2;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--txt);box-shadow:inset 0 0 0 2px var(--line)}.btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}.btn.ok{background:var(--ok)}.btn.w{width:100%}.btn:disabled{opacity:.55;cursor:wait}
/* hero */
.hero{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#000));color:#fff;padding:clamp(36px,6vw,70px) 0 clamp(90px,10vw,120px);position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(44px,7.4vw,92px);max-width:11ch;overflow-wrap:anywhere}
.hero p{max-width:44ch;font-size:clamp(15px,2vw,18px);margin:16px 0 22px;opacity:.93}
.tag{display:inline-block;background:var(--accent);color:var(--ink);font-weight:700;padding:5px 14px;border-radius:99px;margin-bottom:16px;font-size:13px}
.search{display:flex;gap:8px;background:#fff;border-radius:18px;padding:7px;max-width:520px;box-shadow:0 18px 40px -18px rgba(0,0,0,.5)}
.search input{flex:1;border:0;outline:0;padding:11px 14px;background:none;color:#2b1d17;min-width:0}
.plates{position:relative;aspect-ratio:1;max-width:430px;margin-left:auto;width:100%}
.plates i{position:absolute;border-radius:50%;background:#ffffff1f center/cover;border:6px solid #ffffff55;box-shadow:0 24px 50px -20px #0007}
.plates i:nth-child(1){inset:4% 22% 28% 2%}.plates i:nth-child(2){inset:34% 0 0 38%;border-color:var(--accent)}.plates i:nth-child(3){inset:56% 66% 4% 4%;border-radius:40%}
.plates.none{display:none}
/* catalogue */
.chipbar{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);margin-top:-46px;border-radius:22px 22px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 18px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);font-weight:600;font-size:13.5px;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;margin:6px 0 40px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line),0 14px 30px -22px rgba(43,15,15,.45)}
.media{position:relative;aspect-ratio:5/4;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--card)),color-mix(in srgb,var(--accent) 22%,var(--card)));display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--brand)}
.media img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .media img{transform:scale(1.05)}
.badge{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--ink);font-weight:700;font-size:11.5px;padding:4px 11px;border-radius:99px}
.cb{padding:14px 15px 15px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{font-size:12px;font-weight:600;color:var(--brand)}.cb h3{font-size:21px}
.cb p{margin:0;font-size:13px;color:var(--mut)}
.cf{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px}
.price{font:800 23px var(--head)}
.add{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;transition:transform .15s}.add:active{transform:scale(.88)}
.skel{height:240px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--line) 50%,var(--card)),var(--line));background-size:200%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;padding:44px 18px;border:2px dashed var(--line);border-radius:var(--r);color:var(--mut)}.empty b{display:block;color:var(--txt);font:800 21px var(--head);margin-bottom:6px}
/* panels */
.card2{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 1px 0 var(--line),0 14px 30px -22px rgba(43,15,15,.45);margin:14px 0}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:10px;background:var(--line);font-weight:800}
.tot{display:flex;justify-content:space-between;font:800 26px var(--head);margin:12px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.seg button{padding:14px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);font-weight:700}.seg button.on{box-shadow:inset 0 0 0 2px var(--brand);color:var(--brand)}
.err{color:var(--brand);font-weight:700;min-height:18px;font-size:13px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.pill.bad{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(20,8,6,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}.modal.open{display:flex}
.box{background:var(--bg);border-radius:24px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}.box h3{font-size:27px;margin-bottom:10px}
.opt{display:flex;justify-content:space-between;width:100%;padding:15px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);margin:6px 0;font-weight:600}.opt:hover{box-shadow:inset 0 0 0 2px var(--brand)}
.field{display:grid;gap:5px;margin:11px 0;min-width:0}.field>label{font-size:12.5px;font-weight:600;color:var(--mut)}
.field input,.field textarea,.field select,.finput{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--card);outline:0;min-width:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fg .full{grid-column:1/-1}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:90;display:none;max-width:92%;font-weight:600;text-align:center}
#cartBar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;display:none;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:14px 18px;border-radius:18px;font-weight:700;box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
footer{background:var(--ink);color:#d9c9b8;padding:26px 0 calc(26px + 64px);font-size:13.5px}footer a{color:#fff}
/* tracker */
.trh{display:flex;justify-content:space-between;align-items:center;gap:10px}.trh small{display:block;color:var(--mut)}.trh b{font:800 22px var(--head)}
.stp{list-style:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:0;margin:22px 0 14px;position:relative;text-align:center;font-size:12.5px;font-weight:600;color:var(--mut)}
.stp:before{content:"";position:absolute;left:12.5%;right:12.5%;top:11px;height:4px;background:var(--line);border-radius:4px}
.stp:after{content:"";position:absolute;left:12.5%;top:11px;height:4px;background:var(--brand);border-radius:4px;width:calc(75% * var(--p,0));transition:width .6s}
.stp li{position:relative;padding-top:30px}.stp li:before{content:"";position:absolute;left:50%;top:4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 4px var(--line);z-index:1}
.stp li.on{color:var(--txt)}.stp li.on:before{background:var(--brand);box-shadow:inset 0 0 0 4px var(--brand)}.stp li.cur:before{box-shadow:0 0 0 6px color-mix(in srgb,var(--brand) 25%,transparent);animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 11px transparent}}
.drv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--accent) 16%,var(--card));margin:8px 0}.drv>div:nth-child(2){flex:1}.drv small{display:block;color:var(--mut)}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 19px var(--head)}
.map{height:min(52vh,420px);border-radius:18px;background:var(--line);display:grid;place-items:center;color:var(--mut);margin:12px 0;overflow:hidden}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stats div{background:var(--ink);color:#fff;border-radius:16px;padding:14px;text-align:center}.stats b{display:block;font:800 34px var(--head)}.stats small{opacity:.75}
.adm{display:grid;grid-template-columns:210px 1fr;gap:18px}.side{display:flex;flex-direction:column;gap:6px}.side a{padding:12px 14px;border-radius:12px;text-decoration:none;font-weight:600;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);color:inherit}.side a.on{box-shadow:inset 0 0 0 2px var(--brand);color:var(--brand)}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.plates{display:none}.adm{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto}#cartBar.show{display:flex}}
@media(max-width:640px){.wrap{width:calc(100% - 24px)}nav a.hs,#cartBtn{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cb h3{font-size:17px}.cb p{display:none}.price{font-size:19px}.add{width:40px;height:40px}.modal{align-items:flex-end;padding:0}.box{width:100%;border-radius:26px 26px 0 0;max-height:94vh;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.fg{grid-template-columns:1fr}.fg .full{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap"><a id="brand" href="#/"></a>
<nav><a href="#/" class="hs">Menu</a><a href="#/orders">My orders</a><a href="#/driver" id="navDriver" hidden>Driver</a><a href="#/admin" id="navAdmin" hidden>Admin</a><button id="logout" hidden>Sign out</button><button id="cartBtn">Cart<b id="cc">0</b></button></nav></div></header>
<main>
<section id="v-menu">
  <div class="hero"><div class="wrap"><div>
    <span class="tag" id="tagline"></span><h1 id="hTitle"></h1><p id="hDesc"></p>
    <form class="search" id="finder"><input id="fQuery" type="search" placeholder="Search the menu" aria-label="Search the menu"><button class="btn sm" type="submit">Search</button></form>
  </div><div class="plates none" id="plates"></div></div></div>
  <div class="wrap"><div class="chipbar"><div class="chips" id="chips"></div></div><div class="grid" id="products"></div></div>
</section>
<section id="v-orders" hidden><div class="wrap pad"><h2 style="font-size:38px">My orders</h2><div id="ordersBox"></div></div></section>
<section id="v-track" hidden><div class="wrap pad"><h2 style="font-size:38px">Track your order</h2><div id="trBox"></div></div></section>
<section id="v-login" hidden><div class="wrap pad"><div class="box" style="margin:0 auto"><h3>Staff sign in</h3><p class="mut" style="margin-top:0">Use your point of sale username and password. Drivers and admins only.</p><form id="loginForm"><div class="field"><label for="lu">Username</label><input id="lu" autocomplete="username" autocapitalize="off" required></div><div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div><div class="err" id="lerr"></div><button class="btn w">Sign in</button></form></div></div></section>
<section id="v-admin" hidden><div class="wrap pad"><h2 style="font-size:38px;margin-bottom:14px">Website settings</h2><div class="adm"><div class="side" id="admSide"></div><div id="admBody"></div></div></div></section>
<section id="v-driver" hidden><div class="wrap pad"><h2 style="font-size:38px">Driver</h2>
  <div class="card2" id="dTop"><div class="field" style="margin:0"><label for="dPhone">Your phone number (customers see it when you pick an order)</label><input id="dPhone" type="tel" placeholder="+263..."></div><p class="mut" id="gpsNote" style="margin:8px 0 0"></p></div>
  <div id="drvList"></div><div id="navPanel" hidden></div></div></section>
</main>
<div id="cartBar" role="button" tabindex="0"><span id="cbN"></span><span id="cbT"></span></div>
<footer><div class="wrap"><span id="fInfo"></span> &nbsp; <a href="#/login" id="staffLink">Staff</a></div></footer>
<div class="modal" id="modal"><div class="box" id="mb"></div></div><div class="toast" id="toast" role="status"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx-xUtBtcBVfpo00aXmwpxj-9lfQe8E_ocy5adZoArtHxlCRYbqW1KH-UdVuM_ENqq6/exec";
const API_KEY = "AIzaSyCDfl7Ncs3Qs6aTtcuh406kOomJgiRX2pU";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get(k,d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d }catch(e){ return d } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} } };
let cfg = ls.get("cfg", null) || {companyName:"", primaryColor:"#d62828", darkColor:"#2b0f0f", accentColor:"#f0a202", currency:"USD", deliveryFee:"0"};
let menu = ls.get("menu", []), cart = ls.get("cart", []), tok = ls.get("tok", ""), me = ls.get("me", null), type = "takeaway", geo = null, cat = "All", query = "";
const isP = p => /protein/i.test(p.tag), isS = p => /starch/i.test(p.tag);
const money = n => ({USD:"$",ZiG:"ZiG ",ZWL:"ZWL "}[cfg.currency] || "$") + (+n || 0).toFixed(2);
const byId = id => menu.find(p => p.id === id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(s){ const t = $("toast"); t.textContent = s; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3800) }
function modal(h){ $("mb").innerHTML = h; $("modal").classList.add("open") }
function closeModal(){ $("modal").classList.remove("open") }
$("modal").addEventListener("mousedown", e => { if (e.target === $("modal")) closeModal() });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal() });

/* One request helper for the whole site: 15s timeout per try, automatic retries, never hangs. All server actions are idempotent, so retrying is safe. */
async function api(action, data = {}, tries = 3){
  let last;
  for (let i = 0; i < tries; i++){
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(API_URL, {method:"POST", body:JSON.stringify({key:API_KEY, action, token:tok, ...data}), signal:ctl.signal, redirect:"follow"});
      const j = await r.json();
      if (!j.ok){ const e = new Error(j.error || "Request failed"); e.final = true; if (j.auth) signOut(); throw e }
      return j;
    } catch (e){
      if (e.final) throw e;
      last = new Error(e.name === "AbortError" ? "The server is slow right now." : "Cannot connect. Check your internet.");
      if (i < tries - 1) await sleep(700 * (i + 1));
    } finally { clearTimeout(t) }
  }
  throw last;
}

const ICONS = {bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>'};
const ico = n => '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity:.55">' + ICONS[n] + '</svg>';

function applyCfg(){
  const R = document.documentElement.style;
  R.setProperty("--brand", cfg.primaryColor); R.setProperty("--ink", cfg.darkColor); R.setProperty("--accent", cfg.accentColor);
  document.querySelector('meta[name=theme-color]').content = cfg.primaryColor;
  document.title = (cfg.companyName || "Order online") + " | Order online";
  $("brand").innerHTML = (/^https:/.test(cfg.logoUrl || "") ? '<img src="' + esc(cfg.logoUrl) + '" alt="">' : "") + "<span>" + esc(cfg.companyName) + "</span>";
  $("tagline").textContent = cfg.tagline || ""; $("tagline").hidden = !cfg.tagline;
  $("hTitle").textContent = cfg.heroTitle || ""; $("hDesc").textContent = cfg.description || "";
  $("fInfo").textContent = [cfg.companyName, cfg.phone, cfg.address].filter(Boolean).join("  |  ");
}

function renderMenu(){
  const cats = ["All", ...new Set(menu.map(p => p.tag || "Other"))];
  $("chips").innerHTML = cats.map(c => `<button type="button" class="chip ${cat === c ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  let list = menu.filter(p => cat === "All" || (p.tag || "Other") === cat);
  if (query) list = list.filter(p => (p.name + " " + (p.tag || "")).toLowerCase().includes(query));
  const starch = menu.some(isS);
  $("products").innerHTML = !menu.length ? '<div class="skel"></div><div class="skel"></div><div class="skel"></div>' : list.length ? list.map(p => `<article class="card"><div class="media" data-id="${esc(p.id)}">${p.img ? `<img loading="lazy" src="${esc(p.img)}" alt="${esc(p.name)}">` : ico("bag")}${isP(p) && starch ? '<span class="badge">With a starch</span>' : ""}</div>
    <div class="cb"><span class="cat">${esc(p.tag || "Other")}</span><h3>${esc(p.name)}</h3><p>${isP(p) && starch ? "Choose a starch to go with it." : "Made to order."}</p>
    <div class="cf"><span class="price">${money(p.price)}</span><button type="button" class="add" data-id="${esc(p.id)}" aria-label="Add ${esc(p.name)}">+</button></div></div></article>`).join("")
    : '<div class="empty"><b>Nothing matches</b>Try another search or category.</div>';
  const imgs = menu.filter(p => p.img && !isS(p)).slice(0, 3);
  $("plates").className = "plates" + (imgs.length ? "" : " none");
  $("plates").innerHTML = imgs.map(p => `<i style="background-image:url('${esc(p.img)}')"></i>`).join("");
}
$("products").addEventListener("click", e => {
  const t = e.target.closest("[data-id]"); if (!t) return;
  const p = byId(t.dataset.id); if (!p) return;
  const st = menu.filter(isS);
  if (isP(p) && st.length) modal(`<h3>Choose a starch</h3><p class="mut" style="margin-top:0">${esc(p.name)}</p>${st.map(s => `<button class="opt" data-pp="${esc(p.id)}" data-st="${esc(s.id)}"><span>${esc(s.name)}</span><span>${s.price ? "+" + money(s.price) : "Included"}</span></button>`).join("")}<button class="btn alt w" style="margin-top:8px" data-x>Cancel</button>`);
  else addCart(p.id, "");
});
$("mb").addEventListener("click", e => {
  const o = e.target.closest("[data-pp]"); if (o){ addCart(o.dataset.pp, o.dataset.st); closeModal(); return }
  if (e.target.closest("[data-x]")) closeModal();
});
$("finder").addEventListener("submit", e => { e.preventDefault(); query = $("fQuery").value.trim().toLowerCase(); renderMenu(); $("chips").scrollIntoView({behavior:"smooth"}) });

}
function paintNav(){ if (!nav) return; $("nKm").textContent = nav.km != null ? nav.km.toFixed(1) : "--"; $("nMin").textContent = nav.min != null ? nav.min : "--"; if (!pos) $("nKm").title = "Waiting for GPS" }

/* Router (named router so it cannot collide with any map helper) */
const VIEWS = ["menu", "orders", "track", "login", "admin", "driver"];
function router(){
  const [v = "", arg] = location.hash.replace(/^#\/?/, "").split("/"); let name = VIEWS.includes(v) ? v : "menu";
  stopTrack(); if (name !== "driver") stopDriver();
  if (name === "admin" && !(me && me.role === "admin")) name = "login";
  if (name === "driver" && !me) name = "login";
  VIEWS.forEach(x => $("v-" + x).hidden = x !== name); scrollTo(0, 0);
  try {
    if (name === "orders") viewOrders();
    else if (name === "track") startTrack(arg || "");
    else if (name === "admin") viewAdmin();
    else if (name === "driver") viewDriver();
  } catch (e){ toast("Something went wrong. Reload the page.") }
}
addEventListener("hashchange", router);

(async function boot(){
  staffUi(); applyCfg(); renderMenu(); saveCart(); router();
  try { const r = await api("config"); cfg = r.config; menu = r.menu; ls.set("cfg", cfg); ls.set("menu", menu); applyCfg(); renderMenu(); saveCart() }
  catch (e){ if (!menu.length) $("products").innerHTML = '<div class="empty"><b>Cannot load the menu</b>' + esc(e.message) + '<br><br><button class="btn" onclick="location.reload()">Reload</button></div>' }
})();
</script>
</body>
